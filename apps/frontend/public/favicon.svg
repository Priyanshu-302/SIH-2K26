<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden Shield Outer Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Shield Inner Body -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Emerald Leaf Primary -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Emerald Leaf Secondary -->
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Gold Scales Gradient -->
    <linearGradient id="goldScales" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Filter for Leaf Neon Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#eab308" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Outer Golden Protection Shield -->
  <path d="M 256 64 C 330 64 394 92 416 148 C 416 280 348 376 256 432 C 164 376 96 280 96 148 C 118 92 182 64 256 64 Z" 
        fill="url(#goldRim)" filter="url(#goldGlow)"/>

  <!-- Inner Shield Core -->
  <path d="M 256 82 C 320 82 376 106 394 154 C 394 268 334 354 256 404 C 178 354 118 268 118 154 C 136 106 192 82 256 82 Z" 
        fill="url(#shieldInner)"/>

  <!-- Scales of Justice (Top Right of Shield) -->
  <g id="scalesOfJustice" transform="translate(306, 128) scale(0.68)" filter="url(#goldGlow)">
    <!-- Base -->
    <path d="M 40 160 L 80 160 C 80 156 70 152 60 152 C 50 152 40 156 40 160 Z" fill="url(#goldScales)"/>
    <rect x="58" y="44" width="4" height="110" rx="2" fill="url(#goldScales)"/>
    <!-- Top Finial -->
    <circle cx="60" cy="40" r="7" fill="url(#goldScales)"/>
    <path d="M 60 28 L 60 35" stroke="url(#goldScales)" stroke-width="3" stroke-linecap="round"/>
    <!-- Balance Beam -->
    <path d="M 12 56 Q 60 48 108 56" stroke="url(#goldScales)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Left Scale strings & Pan -->
    <line x1="16" y1="56" x2="6" y2="88" stroke="url(#goldScales)" stroke-width="1.8"/>
    <line x1="16" y1="56" x2="26" y2="88" stroke="url(#goldScales)" stroke-width="1.8"/>
    <path d="M 0 88 C 4 102 28 102 32 88 Z" fill="url(#goldScales)"/>
    <!-- Right Scale strings & Pan -->
    <line x1="104" y1="56" x2="94" y2="88" stroke="url(#goldScales)" stroke-width="1.8"/>
    <line x1="104" y1="56" x2="114" y2="88" stroke="url(#goldScales)" stroke-width="1.8"/>
    <path d="M 88 88 C 92 102 116 102 120 88 Z" fill="url(#goldScales)"/>
  </g>

  <!-- Glowing Ayurvedic Sacred Leaf Emblem -->
  <!-- Leaf 1 (Large Main Leaf) -->
  <g filter="url(#emeraldGlow)">
    <path d="M 236 394 C 236 394 152 320 152 230 C 152 144 208 96 208 96 C 208 96 288 160 288 260 C 288 340 236 394 236 394 Z" 
          fill="url(#leafGrad1)"/>
    
    <!-- Central Leaf Vein -->
    <path d="M 208 96 Q 224 230 236 394" 
          stroke="#a7f3d0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Lateral Veins -->
    <path d="M 218 160 Q 186 182 170 210" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 224 210 Q 186 240 174 274" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 230 270 Q 200 300 188 334" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>

    <path d="M 218 160 Q 248 180 266 204" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 226 216 Q 256 244 274 270" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Leaf 2 (Right Flourishing Sprout) -->
  <g filter="url(#emeraldGlow)">
    <path d="M 236 394 C 236 394 286 350 348 300 C 374 278 376 236 376 236 C 376 236 322 246 270 294 C 236 326 236 394 236 394 Z" 
          fill="url(#leafGrad2)"/>
    
    <!-- Sprout Vein -->
    <path d="M 376 236 Q 306 286 236 394" 
          stroke="#6ee7b7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Glowing Stem Base Accent -->
  <circle cx="236" cy="394" r="7" fill="#6ee7b7" filter="url(#emeraldGlow)"/>
</svg>
